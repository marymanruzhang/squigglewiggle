<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketch Animation Engine — Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; font-family: 'Segoe UI', sans-serif; color: #e2e8f0;
       height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

header { padding: 14px 28px; background: #161b27; border-bottom: 1px solid #2d3748;
         display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
header h1 { font-size: 1.15rem; font-weight: 700; }
header p  { font-size: 0.78rem; color: #718096; }

.layout { display: flex; flex: 1; overflow: hidden; }

/* Canvas */
#stage { flex: 1; position: relative; background: #fefefe;
         background-image: radial-gradient(circle, #e8e8e8 1px, transparent 1px);
         background-size: 28px 28px; }
#stage canvas { display: block; }

/* Sidebar */
.sidebar { width: 260px; background: #161b27; border-left: 1px solid #2d3748;
           display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.sidebar h2 { font-size: 0.72rem; font-weight: 700; color: #4a5568;
              text-transform: uppercase; letter-spacing: .1em; padding: 12px 14px 6px; }

/* Spawn grid */
.spawn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 0 10px 10px; }
.spawn-btn {
  background: #1a2035; border: 1px solid #2d3748; border-radius: 8px;
  color: #a0aec0; font-size: 0.68rem; padding: 7px 4px 5px; cursor: pointer;
  transition: all .15s; text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 2px;
}
.spawn-btn img { width: 36px; height: 36px; image-rendering: pixelated; object-fit: contain; }
.spawn-btn span { line-height: 1.1; }
.spawn-btn:hover { background: #243052; border-color: #4a90d9; color: #e2e8f0; }
.spawn-btn.loading { opacity: .5; pointer-events: none; }

/* Log */
.log-wrap { flex: 1; overflow-y: auto; padding: 2px 10px 8px; }
.log-entry { font-size: 0.68rem; padding: 3px 0; border-bottom: 1px solid #1a2035; line-height: 1.3; }
.log-entry.interaction { color: #68d391; }
.log-entry.register    { color: #63b3ed; }
.log-entry.err         { color: #fc8181; }

/* Controls */
.controls { padding: 10px; border-top: 1px solid #2d3748; display: flex; gap: 6px; flex-shrink: 0; }
.ctrl-btn { flex: 1; padding: 7px; border-radius: 7px; border: none;
            font-size: 0.72rem; cursor: pointer; font-weight: 600; transition: opacity .15s; }
.ctrl-btn:hover { opacity: .82; }
.ctrl-btn.start { background: #38a169; color: #fff; }
.ctrl-btn.stop  { background: #c53030; color: #fff; }
.ctrl-btn.clear { background: #2d3748; color: #cbd5e0; }

/* Label badge */
.badge {
  position: absolute; pointer-events: none; font-size: 10px; font-weight: 600;
  background: rgba(0,0,0,.55); color: #fff; padding: 1px 5px; border-radius: 4px;
  transform: translateX(-50%); white-space: nowrap;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🎨 Sketch Animation Engine</h1>
    <p>Real QuickDraw sketches — semantic interactions — spawn objects and watch them meet</p>
  </div>
</header>

<div class="layout">
  <div id="stage"></div>

  <div class="sidebar">
    <h2>Spawn Object</h2>
    <div class="spawn-grid" id="spawnGrid"></div>

    <h2>Event Log</h2>
    <div class="log-wrap" id="log"></div>

    <div class="controls">
      <button class="ctrl-btn start"  id="btnStart">▶ Start</button>
      <button class="ctrl-btn stop"   id="btnStop" >⏹ Stop</button>
      <button class="ctrl-btn clear"  id="btnClear">✕ Clear</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/konva@9/konva.min.js"></script>

<script type="module">
import {
  registerRecognizedSketch, removeSketch,
  startInteractionEngine, stopInteractionEngine,
  getRegistry, getEngine,
} from './index.js';

// ── Log helper ───────────────────────────────────────────────────────────────
const logEl = document.getElementById('log');
function addLog(msg, cls = 'register') {
  const d = document.createElement('div');
  d.className = `log-entry ${cls}`;
  d.textContent = msg;
  logEl.prepend(d);
  if (logEl.children.length > 60) logEl.lastChild.remove();
}
const _origLog = console.log.bind(console);
console.log = (...a) => {
  _origLog(...a);
  const m = a.join(' ');
  addLog(
    m.replace('[SketchEngine] ','').replace('[InteractionEngine] ','⚡ '),
    m.includes('InteractionEngine') ? 'interaction' : 'register'
  );
};
window.addEventListener('unhandledrejection', e =>
  addLog('❌ ' + (e.reason?.message || e.reason), 'err'));
window.addEventListener('error', e => addLog('❌ ' + e.message, 'err'));

// ── Konva stage ──────────────────────────────────────────────────────────────
const stageEl = document.getElementById('stage');
const W = stageEl.offsetWidth, H = stageEl.offsetHeight;
const stage = new Konva.Stage({ container: 'stage', width: W, height: H });
const layer = new Konva.Layer();
stage.add(layer);

// Tell the engine the canvas size for wander bounds
getEngine().resize(W, H);

// ── Fetch a real QuickDraw sample from the server ────────────────────────────
const sketchCache = {};   // label → [dataURL, ...]

async function fetchSketch(label) {
  const npy_label = label.replace(/ /g, '%20');
  const res = await fetch(`/api/sketch-sample/${npy_label}?size=120`);
  if (!res.ok) throw new Error(`No QuickDraw data for "${label}"`);
  const json = await res.json();
  return json.image;  // data:image/png;base64,...
}

// ── Build a Konva.Group with the real QuickDraw sketch ───────────────────────
async function makeRealSketch(label, x, y) {
  const dataURL = await fetchSketch(label);

  return new Promise(resolve => {
    const img = new window.Image();
    img.onload = () => {
      const kImg = new Konva.Image({
        image: img,
        x: -60, y: -60,   // center the 120×120 img on group origin
        width: 120, height: 120,
      });
      const g = new Konva.Group({ x, y, draggable: true });
      g.add(kImg);
      layer.add(g);
      layer.draw();
      resolve(g);
    };
    img.src = dataURL;
  });
}

// ── Spawn ────────────────────────────────────────────────────────────────────
let objCount = 0;
const badges = {};

async function spawnObject(label) {
  // Spawn near center with some randomness so objects are already somewhat close
  const x = W * 0.2 + Math.random() * (W * 0.6);
  const y = H * 0.2 + Math.random() * (H * 0.5);
  const id = `obj_${++objCount}`;

  let group;
  try {
    group = await makeRealSketch(label, x, y);
  } catch (err) {
    addLog(`⚠ ${err.message} — using placeholder`, 'err');
    // Fallback: coloured circle
    group = new Konva.Group({ x, y, draggable: true });
    group.add(new Konva.Circle({ radius: 40, fill: '#b794f4', stroke: '#6b46c1', strokeWidth: 2 }));
    group.add(new Konva.Text({ text: label[0].toUpperCase(), x: -8, y: -12, fontSize: 20, fill: '#fff' }));
    layer.add(group);
    layer.draw();
  }

  group.setAttr('agentId', id);

  // Register — bbox is 120×120 centered on (x,y)
  const agent = registerRecognizedSketch({
    id,
    label,
    confidence: 0.9,
    bbox: { x: x - 60, y: y - 60, width: 120, height: 120 },
    layerRef: group,
  });

  // Update bbox on drag
  group.on('dragend', () => {
    const gx = group.x(), gy = group.y();
    agent.bbox      = { x: gx - 60, y: gy - 60, width: 120, height: 120 };
    agent.originPos = { x: gx,      y: gy };
    if (agent._wander) agent._wander.nextPickTime = Date.now() + 1000;
  });

  // Label badge
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = label;
  badge.style.left = x + 'px';
  badge.style.top  = (y - 70) + 'px';
  stageEl.appendChild(badge);
  badges[id] = badge;

  // Sync badge position during animations (rough sync via rAF)
  ;(function syncBadge() {
    if (!badges[id]) return;
    const pos = group.position();
    badge.style.left = pos.x + 'px';
    badge.style.top  = (pos.y - 70) + 'px';
    requestAnimationFrame(syncBadge);
  })();

  return agent;
}

// ── Spawn buttons (loads preview from server) ────────────────────────────────
const DEMO_LABELS = [
  { label: 'flower',    emoji: '🌸' },
  { label: 'bee',       emoji: '🐝' },
  { label: 'butterfly', emoji: '🦋' },
  { label: 'bird',      emoji: '🐦' },
  { label: 'cloud',     emoji: '☁️' },
  { label: 'sun',       emoji: '☀️' },
  { label: 'rabbit',    emoji: '🐰' },
  { label: 'fish',      emoji: '🐟' },
  { label: 'tree',      emoji: '🌲' },
  { label: 'cat',       emoji: '🐱' },
  { label: 'dog',       emoji: '🐶' },
  { label: 'bird',      emoji: '🦅' },
];

// Deduplicate
const seen = new Set();
const UNIQUE_LABELS = [
  { label:'flower', emoji:'🌸' }, { label:'bee', emoji:'🐝' },
  { label:'butterfly', emoji:'🦋' }, { label:'bird', emoji:'🐦' },
  { label:'cloud', emoji:'☁️' }, { label:'sun', emoji:'☀️' },
  { label:'rabbit', emoji:'🐰' }, { label:'fish', emoji:'🐟' },
  { label:'tree', emoji:'🌲' }, { label:'cat', emoji:'🐱' },
  { label:'dog', emoji:'🐶' }, { label:'mushroom', emoji:'🍄' },
];

const grid = document.getElementById('spawnGrid');

// Pre-load thumbnail previews and build buttons
UNIQUE_LABELS.forEach(({ label, emoji }) => {
  const btn = document.createElement('button');
  btn.className = 'spawn-btn loading';
  btn.title = label;
  btn.innerHTML = `<span style="font-size:1.5rem">${emoji}</span><span>${label}</span>`;
  btn.onclick = () => spawnObject(label);
  grid.appendChild(btn);

  // Fetch a preview PNG and swap emoji for real sketch
  fetch(`/api/sketch-sample/${label}?size=48`)
    .then(r => r.json())
    .then(({ image }) => {
      btn.innerHTML = `<img src="${image}" alt="${label}"><span>${label}</span>`;
      btn.classList.remove('loading');
    })
    .catch(() => {
      btn.classList.remove('loading');
    });
});

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById('btnStart').onclick = startInteractionEngine;
document.getElementById('btnStop').onclick  = stopInteractionEngine;
document.getElementById('btnClear').onclick = () => {
  stopInteractionEngine();
  getRegistry().getAll().forEach(a => removeSketch(a.id));
  layer.destroyChildren(); layer.draw();
  Object.values(badges).forEach(b => b.remove());
  Object.keys(badges).forEach(k => delete badges[k]);
  objCount = 0;
  startInteractionEngine();
};

// ── Auto-start engine ─────────────────────────────────────────────────────────
startInteractionEngine();

// ── Pre-spawn two pairs that will naturally interact ─────────────────────────
// Spawn them close so interactions happen quickly on load
async function autoSpawn() {
  // Flower and bee — will trigger pollinator interaction
  await spawnObject('flower');
  await spawnObject('bee');
  // Cloud and tree — will trigger wind/rain interaction
  await spawnObject('cloud');
  await spawnObject('tree');
}
autoSpawn().catch(console.error);
</script>
</body>
</html>
