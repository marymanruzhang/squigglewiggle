<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquiggleWiggle — Story Interaction Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & base ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Segoe UI', sans-serif;
  background: #0b0e18;
  color: #e2e8f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────── */
header {
  padding: 10px 22px;
  background: #111827;
  border-bottom: 1px solid #1f2937;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.logo span { color: #a78bfa; }
.tagline { font-size: 0.72rem; color: #6b7280; }
.header-right { display: flex; align-items: center; gap: 8px; }

/* ── Story status bar ────────────────────────────────────────────── */
#storyBar {
  background: #111827;
  border-bottom: 1px solid #1f2937;
  padding: 6px 22px;
  min-height: 36px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.72rem;
  overflow: hidden;
}
#storyBar .story-idle { color: #4b5563; font-style: italic; }
#storyBar .story-playing { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.beat-chip {
  background: #1d2535;
  border: 1px solid #374151;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 0.66rem;
  color: #9ca3af;
  transition: all 0.2s;
}
.beat-chip.active {
  background: #312e81;
  border-color: #6366f1;
  color: #c7d2fe;
  box-shadow: 0 0 8px rgba(99,102,241,0.4);
}
.beat-chip.done {
  background: #064e3b;
  border-color: #10b981;
  color: #6ee7b7;
}
.story-pair { font-weight: 600; color: #a78bfa; }
.story-label {
  font-size: 0.68rem;
  color: #6b7280;
  white-space: nowrap;
}

/* ── Layout ──────────────────────────────────────────────────────── */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ── Canvas stage ────────────────────────────────────────────────── */
#stage {
  flex: 1;
  position: relative;
  background: #f8f9fc;
  background-image:
    radial-gradient(circle, #dde1ea 1px, transparent 1px);
  background-size: 26px 26px;
  overflow: hidden;
}
#stage canvas { display: block; }

/* ── Agent state badges ──────────────────────────────────────────── */
.badge {
  position: absolute;
  pointer-events: none;
  white-space: nowrap;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.badge-label {
  font-size: 9px;
  font-weight: 700;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 1px 5px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}
.badge-state {
  font-size: 8px;
  padding: 1px 5px;
  border-radius: 3px;
  background: #1f2937;
  color: #6b7280;
  transition: all 0.3s;
}
.badge-state.idle       { background: #1c2535; color: #6b7280; }
.badge-state.story_active { background: #312e81; color: #c7d2fe;
  box-shadow: 0 0 6px rgba(99,102,241,0.5); animation: pulseState 1s infinite; }
.badge-state.returning  { background: #064e3b; color: #6ee7b7; }
@keyframes pulseState {
  0%,100% { opacity: 1; } 50% { opacity: 0.6; }
}

/* ── Sidebar ─────────────────────────────────────────────────────── */
.sidebar {
  width: 260px;
  background: #111827;
  border-left: 1px solid #1f2937;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.sidebar-section-title {
  font-size: 0.65rem;
  font-weight: 700;
  color: #4b5563;
  text-transform: uppercase;
  letter-spacing: .1em;
  padding: 10px 14px 6px;
}

/* ── Pair shortcuts ──────────────────────────────────────────────── */
.pair-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  padding: 0 10px 8px;
}
.pair-btn {
  background: #1a2035;
  border: 1px solid #1f2937;
  border-radius: 8px;
  color: #9ca3af;
  font-size: 0.64rem;
  padding: 6px 6px 5px;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-weight: 500;
}
.pair-btn:hover { background: #243052; border-color: #4f46e5; color: #e0e7ff; }
.pair-btn .arrow { color: #6b7280; }

/* ── Spawn grid ──────────────────────────────────────────────────── */
.spawn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 0 10px 8px;
}
.spawn-btn {
  background: #1a2035;
  border: 1px solid #1f2937;
  border-radius: 7px;
  color: #9ca3af;
  font-size: 0.58rem;
  padding: 5px 3px 4px;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  line-height: 1.1;
}
.spawn-btn img { width: 30px; height: 30px; image-rendering: pixelated; object-fit: contain; }
.spawn-btn .emo { font-size: 1.2rem; }
.spawn-btn:hover { background: #243052; border-color: #4f46e5; color: #e0e7ff; }
.spawn-btn.loading { opacity: .45; pointer-events: none; }

/* ── Event log ───────────────────────────────────────────────────── */
.log-wrap { flex: 1; overflow-y: auto; padding: 2px 10px 8px; }
.log-entry {
  font-size: 0.65rem;
  padding: 3px 0;
  border-bottom: 1px solid #111827;
  line-height: 1.35;
  font-family: 'Inter', monospace;
}
.log-entry.story      { color: #a78bfa; }
.log-entry.beat       { color: #6ee7b7; padding-left: 8px; }
.log-entry.register   { color: #60a5fa; }
.log-entry.err        { color: #f87171; }
.log-entry.system     { color: #6b7280; }

/* ── Controls ────────────────────────────────────────────────────── */
.controls { padding: 8px 10px; border-top: 1px solid #1f2937;
            display: flex; gap: 5px; flex-shrink: 0; }
.ctrl-btn {
  flex: 1; padding: 7px 4px; border-radius: 7px; border: none;
  font-size: 0.68rem; cursor: pointer; font-weight: 600;
  transition: opacity .15s, transform .1s; font-family: inherit;
}
.ctrl-btn:hover { opacity: .85; }
.ctrl-btn:active { transform: scale(.97); }
.ctrl-btn.start  { background: #059669; color: #fff; }
.ctrl-btn.stop   { background: #dc2626; color: #fff; }
.ctrl-btn.clear  { background: #374151; color: #d1d5db; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <div class="logo">SquiggleWiggle<span>.ai</span></div>
      <div class="tagline">Story interaction layer — multi-beat animated scenes</div>
    </div>
  </div>
  <div class="header-right">
    <span id="agentCount" style="font-size:0.7rem;color:#6b7280;">0 objects</span>
  </div>
</header>

<!-- Story status bar: shows current story + beat timeline -->
<div id="storyBar">
  <span class="story-idle">Waiting for objects to interact…</span>
</div>

<div class="layout">
  <div id="stage"></div>

  <div class="sidebar">

    <!-- Iconic story pairs — spawns both with one click -->
    <div class="sidebar-section-title">🎭 Story Pairs</div>
    <div class="pair-grid" id="pairGrid"></div>

    <!-- Individual spawns -->
    <div class="sidebar-section-title">➕ Spawn Object</div>
    <div class="spawn-grid" id="spawnGrid"></div>

    <!-- Event log -->
    <div class="sidebar-section-title">📋 Event Log</div>
    <div class="log-wrap" id="log"></div>

    <div class="controls">
      <button class="ctrl-btn start"  id="btnStart">▶ Start</button>
      <button class="ctrl-btn stop"   id="btnStop">⏹ Stop</button>
      <button class="ctrl-btn clear"  id="btnClear">✕ Clear</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/konva@9/konva.min.js"></script>

<script type="module">
import {
  registerRecognizedSketch, removeSketch,
  startInteractionEngine, stopInteractionEngine,
  getRegistry, getEngine, clearAllCooldowns,
} from './index.js';

// ── Console interception ──────────────────────────────────────────────────────
const logEl = document.getElementById('log');

function addLog(msg, cls = 'system') {
  const d = document.createElement('div');
  d.className = `log-entry ${cls}`;
  d.textContent = msg;
  logEl.prepend(d);
  if (logEl.children.length > 80) logEl.lastChild.remove();
}

const _origLog  = console.log.bind(console);
const _origWarn = console.warn.bind(console);

console.log = (...a) => {
  _origLog(...a);
  const m = a.join(' ');
  let cls = 'system';
  if (m.includes('[StoryRunner]')) cls = m.includes('▶') ? 'story' : 'beat';
  else if (m.includes('[SketchEngine]') || m.includes('registered')) cls = 'register';
  else if (m.includes('[InteractionEngine]')) cls = 'story';
  addLog(m.replace(/\[.*?\]\s*/, ''), cls);
};
console.warn = (...a) => {
  _origWarn(...a);
  addLog('⚠ ' + a.join(' '), 'err');
};
window.addEventListener('unhandledrejection', e =>
  addLog('❌ ' + (e.reason?.message || e.reason), 'err'));
window.addEventListener('error', e => addLog('❌ ' + e.message, 'err'));

// ── Story bar update ──────────────────────────────────────────────────────────
// Patch console.log to detect story start/end/beat events
const storyBar = document.getElementById('storyBar');
let currentStoryBeats = [];
let storyBarActive = false;

function setStoryBarIdle() {
  storyBarActive = false;
  storyBar.innerHTML = '<span class="story-idle">Waiting for objects to interact…</span>';
}

function setStoryBarPlaying(storyId, sourceName, targetName, beats) {
  storyBarActive = true;
  currentStoryBeats = beats || [];

  const beatChips = currentStoryBeats.map((b, i) =>
    `<span class="beat-chip" id="chip_${i}">${b}</span>`
  ).join('');

  storyBar.innerHTML = `
    <div class="story-playing">
      <span class="story-pair">${sourceName} ↔ ${targetName}</span>
      <span class="story-label">${storyId}</span>
      ${beatChips}
    </div>`;
}

function advanceStoryBarBeat(beatIndex) {
  const chips = storyBar.querySelectorAll('.beat-chip');
  chips.forEach((c, i) => {
    if (i < beatIndex) c.className = 'beat-chip done';
    else if (i === beatIndex) c.className = 'beat-chip active';
    else c.className = 'beat-chip';
  });
}

// Intercept storyRunner logs to drive the story bar
const _origLogOrig = _origLog;
const storyLogInterceptor = (...a) => {
  const m = a.join(' ');
  if (m.includes('[StoryRunner] ▶')) {
    // "▶ dog_cake: "dog" + "cake""
    const match = m.match(/▶ (\S+): "(.+?)" \+ "(.+?)"/);
    if (match) {
      const [_, id, src, tgt] = match;
      // Extract beat names from templates (we read them dynamically below)
      setStoryBarPlaying(id, src, tgt, getBeatsForStory(id));
    }
  } else if (m.includes('[StoryRunner] ✓')) {
    setTimeout(setStoryBarIdle, 800);
  }
};

// Override console.log to also call storyLogInterceptor
const __origLog = console.log;
console.log = (...a) => { __origLog(...a); storyLogInterceptor(...a); };

// ── Story beat names lookup (for UI display) ──────────────────────────────────
// We import storyTemplates to read beat names for the timeline
import { STORY_TEMPLATES } from './storyTemplates.js';

function getBeatsForStory(id) {
  const t = STORY_TEMPLATES.find(t => t.id === id);
  if (!t) return [];
  return t.beats.map(b => b.type.replace(/([A-Z])/g, ' $1').trim().toLowerCase());
}

// ── Konva stage ──────────────────────────────────────────────────────────────
const stageEl = document.getElementById('stage');
const W = stageEl.offsetWidth, H = stageEl.offsetHeight;
const stage = new Konva.Stage({ container: 'stage', width: W, height: H });
const layer = new Konva.Layer();
stage.add(layer);

getEngine().resize(W, H);

// ── QuickDraw fetch ───────────────────────────────────────────────────────────
async function fetchSketch(label) {
  const res = await fetch(`/api/sketch-sample/${encodeURIComponent(label)}?size=120`);
  if (!res.ok) throw new Error(`No QuickDraw data for "${label}"`);
  return (await res.json()).image;
}

// ── Build a Konva.Group from a QuickDraw sample ───────────────────────────────
async function makeRealSketch(label, x, y) {
  const dataURL = await fetchSketch(label);
  return new Promise(resolve => {
    const img = new window.Image();
    img.onload = () => {
      const kImg = new Konva.Image({ image: img, x: -60, y: -60, width: 120, height: 120 });
      const g = new Konva.Group({ x, y, draggable: true });
      g.add(kImg);
      layer.add(g);
      layer.draw();
      resolve(g);
    };
    img.src = dataURL;
  });
}

// ── Spawn ─────────────────────────────────────────────────────────────────────
let objCount = 0;
const badges = {};

async function spawnObject(label, forcedX, forcedY) {
  const x = forcedX ?? (W * 0.15 + Math.random() * (W * 0.7));
  const y = forcedY ?? (H * 0.2  + Math.random() * (H * 0.55));
  const id = `obj_${++objCount}`;

  let group;
  try {
    group = await makeRealSketch(label, x, y);
  } catch (err) {
    addLog(`⚠ ${err.message} — placeholder`, 'err');
    group = new Konva.Group({ x, y, draggable: true });
    const colors = { dog:'#fbbf24', cat:'#f472b6', butterfly:'#818cf8', bee:'#f59e0b',
                     flower:'#34d399', cloud:'#94a3b8', sun:'#fde68a', bird:'#60a5fa' };
    const fill = colors[label] || '#a78bfa';
    group.add(new Konva.Circle({ radius: 42, fill, stroke: '#fff', strokeWidth: 1.5, opacity: 0.85 }));
    group.add(new Konva.Text({
      text: label.slice(0,2).toUpperCase(), x: -16, y: -10,
      fontSize: 16, fill: '#fff', fontStyle: 'bold',
    }));
    layer.add(group);
    layer.draw();
  }

  group.setAttr('agentId', id);

  const agent = registerRecognizedSketch({
    id, label, confidence: 0.92,
    bbox: { x: x - 60, y: y - 60, width: 120, height: 120 },
    layerRef: group,
  });

  // Update origin on drag end
  group.on('dragend', () => {
    const gx = group.x(), gy = group.y();
    agent.bbox      = { x: gx - 60, y: gy - 60, width: 120, height: 120 };
    agent.originPos = { x: gx, y: gy };
    if (agent._wander) agent._wander.nextPickTime = Date.now() + 800;
    updateBadgePos(id, gx, gy);
  });

  // ── Agent state badge ──────────────────────────────────────────────
  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.innerHTML = `
    <div class="badge-label">${label}</div>
    <div class="badge-state idle" id="bstate_${id}">idle</div>`;
  stageEl.appendChild(badge);
  badges[id] = badge;

  updateBadgePos(id, x, y);

  // rAF sync: keep badge following the Konva group & reflect agent state
  ;(function syncBadge() {
    if (!badges[id]) return;
    const pos = group.position();
    updateBadgePos(id, pos.x, pos.y);
    // Reflect agent state
    const stateEl = document.getElementById(`bstate_${id}`);
    if (stateEl && agent) {
      const s = agent.state || 'idle';
      stateEl.textContent  = s;
      stateEl.className    = `badge-state ${s}`;
    }
    requestAnimationFrame(syncBadge);
  })();

  // Update agent count
  document.getElementById('agentCount').textContent =
    `${getRegistry().getAll().length} object${getRegistry().getAll().length !== 1 ? 's' : ''}`;

  return agent;
}

function updateBadgePos(id, x, y) {
  const b = badges[id];
  if (!b) return;
  b.style.left = x + 'px';
  b.style.top  = (y - 78) + 'px';
}

// ── Story pair buttons ────────────────────────────────────────────────────────
const STORY_PAIRS = [
  { a: 'butterfly', b: 'flower',  label: '🦋 + 🌸' },
  { a: 'bee',       b: 'flower',  label: '🐝 + 🌸' },
  { a: 'dog',       b: 'cake',    label: '🐶 + 🎂' },
  { a: 'cat',       b: 'bird',    label: '🐱 + 🐦' },
  { a: 'cloud',     b: 'flower',  label: '☁️ + 🌸' },
  { a: 'sun',       b: 'flower',  label: '☀️ + 🌸' },
  { a: 'rabbit',    b: 'carrot',  label: '🐰 + 🥕' },
  { a: 'bird',      b: 'tree',    label: '🐦 + 🌲' },
];

const pairGrid = document.getElementById('pairGrid');
STORY_PAIRS.forEach(({ a, b, label }) => {
  const btn = document.createElement('button');
  btn.className = 'pair-btn';
  btn.innerHTML = label;
  btn.title = `Spawn ${a} + ${b}`;
  btn.onclick = async () => {
    // Spawn close together near centre so story triggers quickly
    const cx = W / 2, cy = H / 2;
    const spread = 180;
    await spawnObject(a, cx - spread / 2 + (Math.random() * 40 - 20),
                         cy + (Math.random() * 40 - 20));
    await spawnObject(b, cx + spread / 2 + (Math.random() * 40 - 20),
                         cy + (Math.random() * 40 - 20));
  };
  pairGrid.appendChild(btn);
});

// ── Individual spawn buttons ──────────────────────────────────────────────────
const SPAWN_LABELS = [
  { label: 'flower',    emoji: '🌸' },
  { label: 'bee',       emoji: '🐝' },
  { label: 'butterfly', emoji: '🦋' },
  { label: 'bird',      emoji: '🐦' },
  { label: 'cloud',     emoji: '☁️' },
  { label: 'sun',       emoji: '☀️' },
  { label: 'rabbit',    emoji: '🐰' },
  { label: 'carrot',    emoji: '🥕' },
  { label: 'tree',      emoji: '🌲' },
  { label: 'cat',       emoji: '🐱' },
  { label: 'dog',       emoji: '🐶' },
  { label: 'fish',      emoji: '🐟' },
  { label: 'pond',      emoji: '🏊' },
  { label: 'mushroom',  emoji: '🍄' },
  { label: 'sheep',     emoji: '🐑' },
  { label: 'umbrella',  emoji: '☂️' },
];

const spawnGrid = document.getElementById('spawnGrid');
SPAWN_LABELS.forEach(({ label, emoji }) => {
  const btn = document.createElement('button');
  btn.className = 'spawn-btn loading';
  btn.title = label;
  btn.innerHTML = `<span class="emo">${emoji}</span><span>${label}</span>`;
  btn.onclick = () => spawnObject(label);
  spawnGrid.appendChild(btn);

  fetch(`/api/sketch-sample/${encodeURIComponent(label)}?size=48`)
    .then(r => r.json())
    .then(({ image }) => {
      btn.innerHTML = `<img src="${image}" alt="${label}"><span>${label}</span>`;
      btn.classList.remove('loading');
    })
    .catch(() => btn.classList.remove('loading'));
});

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('btnStart').onclick = startInteractionEngine;
document.getElementById('btnStop').onclick  = stopInteractionEngine;
document.getElementById('btnClear').onclick = () => {
  stopInteractionEngine();
  getRegistry().getAll().forEach(a => removeSketch(a.id));
  layer.destroyChildren(); layer.draw();
  Object.values(badges).forEach(b => b.remove());
  Object.keys(badges).forEach(k => delete badges[k]);
  clearAllCooldowns();
  objCount = 0;
  document.getElementById('agentCount').textContent = '0 objects';
  setStoryBarIdle();
  startInteractionEngine();
  addLog('↺ Scene cleared', 'system');
};

// ── Auto-start ────────────────────────────────────────────────────────────────
startInteractionEngine();

// ── Auto-spawn a showcase pair on load ────────────────────────────────────────
async function autoSpawn() {
  // Spawn a nice opening pair: butterfly + flower, close together
  const cx = W / 2, cy = H / 2;
  await spawnObject('butterfly', cx - 160, cy + 20);
  await spawnObject('flower',    cx + 100, cy + 20);

  // After a bit, add a second pair for multi-object scene richness
  setTimeout(async () => {
    await spawnObject('cloud', cx - 60, cy - 160);
    await spawnObject('tree',  cx + 220, cy + 30);
  }, 3500);
}
autoSpawn().catch(console.error);
</script>
</body>
</html>
